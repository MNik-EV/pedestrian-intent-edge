detection:
  # PC: yolov8n-pose (auto) — adds COCO-17 skeleton keypoints for persons on
  # top of detection; single-class (person) model, so non-person classes are
  # no longer detected in the live demo path. Avoid combined Face+HOG —
  # causes duplicate persons.
  backend: auto
  model_path: yolov8n-pose.pt
  conf_threshold: 0.50
  iou_threshold: 0.50
  input_width: 640
  input_height: 640
  device: cpu
  class_names: [person]

tracking:
  iou_threshold: 0.35
  max_age: 12
  min_hits: 3
  dynamic_speed_mps: 0.40
  dynamic_confirm_frames: 10

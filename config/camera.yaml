camera:
  driver: v4l2  # v4l2 | ps3eye | mock
  device: /dev/video0
  # PS3 Eye typical: 640x480 @ 30/60
  width: 640
  height: 480
  fps: 30
  frame_id: camera
  encoding: bgr8
  exposure: auto
  gain: auto
  undistort: false
  calibration_file: calibration/camera_intrinsics.yaml

preprocessing:
  grayscale: true
  resize_width: 640
  resize_height: 480

topics:
  image_raw: /camera/image_raw
  image_proc: /camera/image_proc
  camera_info: /camera/camera_info
  features: /vision/features
  confidence: /camera/confidence

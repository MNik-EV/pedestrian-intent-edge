camera:
  driver: network_mjpeg  # primary: Pi Zero 2W picamera2 relay
  model: IMX219-120
  transport: http_mjpeg
  stream_url: http://raspberrypi.local:8000/stream.mjpg
  # Bench-only USB fallback; index 1 was the PS3 Eye on the development laptop.
  device_index: 1
  width: 640
  height: 480
  fps: 15
  frame_id: camera
  encoding: bgr8
  exposure: auto
  gain: auto
  undistort: false
  calibration_file: calibration/imx219_intrinsics.yaml

preprocessing:
  grayscale: false
  resize_width: 640
  resize_height: 480

topics:
  image_raw: /camera/image_raw
  image_proc: /camera/image_proc
  camera_info: /camera/camera_info
  features: /vision/features
  confidence: /camera/confidence

dashboard:
  title: AMP Robot Control Center
  host: 0.0.0.0
  port: 8000
  cors_origins: ["*"]
  websocket_hz: 10
  auth:
    enabled: true
    # Token from environment AMP_CONTROL_TOKEN — never commit secrets
    control_token_env: AMP_CONTROL_TOKEN
  ui:
    show_lidar_overlay: true
    show_boxes: true
    show_tracking: true
    show_distances: true
    show_fps: true
    emergency_zone_m: 0.30
    warning_zone_m: 0.60
    navigation_zone_m: 1.00

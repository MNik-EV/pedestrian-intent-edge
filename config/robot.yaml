# Master robot configuration — enable/disable optional hardware without code changes.
robot:
  name: amp_robot
  namespace: amp
  base_frame: base_link
  map_frame: map
  odom_frame: odom

hardware:
  lidar: true
  camera: true
  imu: false
  wheel_encoders: false
  motor_controller: false

runtime:
  target: auto  # auto | pc_mock | raspberry_pi
  fusion_mode: adaptive_fusion  # lidar_only | camera_only | fixed_fusion | adaptive_fusion | adaptive_fusion_dynfilter
  dynamic_filtering: true
  reliability_mode: MODE_HEURISTIC_ADAPTIVE

safety:
  max_linear_speed: 0.35
  max_angular_speed: 0.80
  min_obstacle_distance: 0.35
  emergency_stop_distance: 0.25
  warning_distance: 0.60
  heartbeat_timeout_s: 0.5
  lidar_timeout_s: 0.4

network:
  dashboard_host: 0.0.0.0
  dashboard_port: 8000
  require_auth_for_control: true

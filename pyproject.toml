[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-robot"
version = "0.2.0"
description = "Adaptive Multimodal Perception and Sensor Fusion for Robust Low-Cost Autonomous Indoor Robots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AMP Research" }]
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pytest>=8.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8"]
onnx = ["onnxruntime>=1.17"]
plots = ["matplotlib>=3.8"]
serial = ["pyserial>=3.5"]
dev = ["ruff>=0.3", "mypy>=1.8"]

[project.scripts]
amp-mock = "scripts.run_mock_stack:main"

[tool.setuptools.packages.find]
include = ["amp_core*", "web_dashboard*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
